<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task board</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <main>
        <!-- Form section -->
        <section>
            <form id="form">
                <h2>Add new task</h2>

                <label>New task</label>
                <input id="task-input" type="text" placeholder="Enter new task" />

                <label>Priority</label>
                <select name="priority" id="priority-select">
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                    <option value="urgent">urgent</option>
                </select>

                <button id="form-btn">Add task</button>
            </form>

            <div class="task-list">
                <h2>Task lists</h2>

                <div class="task">
                    <input type="checkbox" />
                    <div class="task-content">
                        <p>Create auth system</p>
                        <span class="priority low">low</span>
                    </div>
                    <div class="task-actions">
                        <button><i class="ri-edit-line"></i></button>
                        <button><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
                <div class="task">
                    <input type="checkbox" />
                    <div class="task-content">
                        <p>Build a task board</p>
                        <span class="priority medium">medium</span>
                    </div>
                    <div class="task-actions">
                        <button><i class="ri-edit-line"></i></button>
                        <button><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
                <div class="task">
                    <input type="checkbox" />
                    <div class="task-content">
                        <p>Build a LMS</p>
                        <span class="priority high">high</span>
                    </div>
                    <div class="task-actions">
                        <button><i class="ri-edit-line"></i></button>
                        <button><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
