<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task board</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <main>
        <!-- task record -->
        <section class="records" style="grid-area: panel-1;">
            <h2>My tasks</h2>

            <div class="task-records">
                <div class="record">
                    <span>Completed: </span>
                    <span>0</span>
                </div>
                <div class="record">
                    <span>Uncompleted: </span>
                    <span>5</span>
                </div>
                <div class="record">
                    <span>Total: </span>
                    <span>5</span>
                </div>
            </div>
        </section>

        <!-- Form section -->
        <section class="form-section" style="grid-area: panel-2;">
            <form id="form">
                <h2>Add new task</h2>

                <label>New task</label>
                <input id="task-input" type="text" placeholder="Enter new task" required />

                <label>Priority</label>
                <select name="priority" id="priority-select" required>
                    <option value="none">Select priority</option>
                    <option value="low">low</option>
                    <option value="medium">medium</option>
                    <option value="high">high</option>
                    <option value="urgent">urgent</option>
                </select>

                <button id="form-btn">Add task</button>
            </form>
        </section>

        <section style="grid-area: panel-3;">
            <h2>Task lists</h2>

            <div class="task-list">
                <div class="task">
                    <input type="checkbox" />
                    <div class="task-content">
                        <p>Create auth system and document anldnl adfa</p>
                        <span class="priority low">low</span>
                    </div>
                    <div class="task-actions">
                        <button><i class="ri-edit-line"></i></button>
                        <button><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
                <div class="task">
                    <input type="checkbox" />
                    <div class="task-content">
                        <p>Create auth system and document anldnl adfa</p>
                        <span class="priority low">low</span>
                    </div>
                    <div class="task-actions">
                        <button><i class="ri-edit-line"></i></button>
                        <button><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
                <div class="task">
                    <input type="checkbox" />
                    <div class="task-content">
                        <p>Create auth system and document anldnl adfa</p>
                        <span class="priority low">low</span>
                    </div>
                    <div class="task-actions">
                        <button><i class="ri-edit-line"></i></button>
                        <button><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
                <div class="task">
                    <input type="checkbox" />
                    <div class="task-content">
                        <p>Build a task board</p>
                        <span class="priority medium">medium</span>
                    </div>
                    <div class="task-actions">
                        <button><i class="ri-edit-line"></i></button>
                        <button><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
                <div class="task">
                    <input type="checkbox" />
                    <div class="task-content">
                        <p>Build a LMS</p>
                        <span class="priority high">high</span>
                    </div>
                    <div class="task-actions">
                        <button><i class="ri-edit-line"></i></button>
                        <button><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
                <div class="task">
                    <input type="checkbox" />
                    <div class="task-content">
                        <p>Build a LMS</p>
                        <span class="priority urgent">high</span>
                    </div>
                    <div class="task-actions">
                        <button><i class="ri-edit-line"></i></button>
                        <button><i class="ri-delete-bin-line"></i></button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
